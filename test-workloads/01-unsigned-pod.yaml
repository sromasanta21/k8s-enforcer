# Test 1: Hardened securityContext, but UNSIGNED image (Tests Cosign Gate)

apiVersion: v1
kind: Pod
metadata:
  name: test-unsigned-pod
  namespace: default
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]