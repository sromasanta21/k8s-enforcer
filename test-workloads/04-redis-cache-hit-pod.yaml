apiVersion: v1
kind: Pod
metadata:
  name: test-redis-cache-hit-pod
  labels:
    app: cache-verification
    tier: test
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  containers:
    - name: cached-signed-app
      image: sromasanta21/k8s-webhook-enforcer:v1.0.0
      command: ["python3", "-c", "import time; print('Admitted via Redis digest cache'); time.sleep(3600)"]
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
